# Loothub Shader - Sonne mit Richtung und Schatten, wehende Pflanzen, Wasser, Nachthimmel, Farbstimmung, Gluehen, Dunst
oldLighting=false
program.shadow.enabled=SHADOWS
screen=<profile> PACK_VERSION [LICHT] [WASSER] [WELT] [FARBE] [GLUEHEN] [FEHLERSUCHE]
screen.LICHT=SUN_SIZE SHADOWS shadowMapResolution shadowDistance SHADOW_SOFT SUN_LIGHT SHADOW_LEVEL NIGHT_LIGHT sunPathRotation LIGHT_NEUTRAL
screen.WASSER=WATER_FX WATER_WAVES WATER_REFLECT WATER_DEPTH WATER_FOAM UNDERWATER_FOG <empty> <empty> ICE_FX ICE_SPARKLE
screen.WELT=WAVING WAVE_STRENGTH HAZE <empty> NEBULAS NEBULA_STRENGTH CUSTOM_STARS STAR_AMOUNT
screen.FARBE=EXPOSURE CONTRAST SATURATION WARMTH VIGNETTE AIRY
screen.GLUEHEN=BLOOM BLOOM_STRENGTH BLOOM_THRESHOLD BLOOM_RADIUS
screen.FEHLERSUCHE=LIGHT_MODE DEBUG_VIEW
sliders=ICE_SPARKLE SUN_SIZE UNDERWATER_FOG NEBULA_STRENGTH STAR_AMOUNT LIGHT_NEUTRAL EXPOSURE CONTRAST SATURATION WARMTH AIRY BLOOM_STRENGTH BLOOM_THRESHOLD BLOOM_RADIUS VIGNETTE HAZE SUN_LIGHT SHADOW_LEVEL SHADOW_SOFT NIGHT_LIGHT WAVE_STRENGTH WATER_REFLECT WATER_WAVES WATER_DEPTH shadowMapResolution shadowDistance sunPathRotation
screen.columns=2

# Sehr schwach: kaum Effekte, sehr schnell
profile.STUFE1=!SHADOWS !BLOOM !WAVING !NEBULAS CUSTOM_STARS WATER_FX !WATER_FOAM STAR_AMOUNT=0.75 WATER_WAVES=0.50 WATER_REFLECT=0.30 WATER_DEPTH=0.75 EXPOSURE=1.00 CONTRAST=1.00 SATURATION=0.96 WARMTH=0.00 AIRY=0.00 VIGNETTE=0.00 HAZE=0.00 SUN_LIGHT=0.40 SHADOW_LEVEL=0.72 !ICE_FX
# Schwach: dezent, Schatten klein und kurz
profile.STUFE2=SHADOWS shadowMapResolution=1024 shadowDistance=64.0 SHADOW_SOFT=2.0 !BLOOM WAVING WAVE_STRENGTH=0.75 NEBULAS NEBULA_STRENGTH=0.50 CUSTOM_STARS STAR_AMOUNT=1.00 WATER_FX WATER_FOAM WATER_WAVES=0.75 WATER_REFLECT=0.50 WATER_DEPTH=1.00 EXPOSURE=1.00 CONTRAST=1.02 SATURATION=0.96 WARMTH=0.00 AIRY=0.00 VIGNETTE=0.06 HAZE=0.04 SUN_LIGHT=0.50 SHADOW_LEVEL=0.65 ICE_FX ICE_SPARKLE=0.50
# Normal: Standard
profile.STUFE3=SHADOWS shadowMapResolution=1536 shadowDistance=80.0 SHADOW_SOFT=1.5 BLOOM BLOOM_STRENGTH=0.55 BLOOM_THRESHOLD=0.45 BLOOM_RADIUS=2.0 WAVING WAVE_STRENGTH=1.00 NEBULAS NEBULA_STRENGTH=0.80 CUSTOM_STARS STAR_AMOUNT=1.00 WATER_FX WATER_FOAM WATER_WAVES=1.00 WATER_REFLECT=0.70 WATER_DEPTH=1.00 EXPOSURE=1.00 CONTRAST=1.05 SATURATION=0.96 WARMTH=0.00 AIRY=0.00 VIGNETTE=0.12 HAZE=0.10 SUN_LIGHT=0.60 SHADOW_LEVEL=0.58 ICE_FX ICE_SPARKLE=1.00
# Extreme: kräftige Farben, starkes Licht, deutliche Effekte
profile.STUFE4=SHADOWS shadowMapResolution=2048 shadowDistance=96.0 SHADOW_SOFT=1.0 BLOOM BLOOM_STRENGTH=0.85 BLOOM_THRESHOLD=0.30 BLOOM_RADIUS=2.5 WAVING WAVE_STRENGTH=1.30 NEBULAS NEBULA_STRENGTH=1.30 CUSTOM_STARS STAR_AMOUNT=1.50 WATER_FX WATER_FOAM WATER_WAVES=1.50 WATER_REFLECT=0.85 WATER_DEPTH=1.50 EXPOSURE=1.05 CONTRAST=1.10 SATURATION=1.00 WARMTH=0.02 AIRY=0.00 VIGNETTE=0.20 HAZE=0.25 SUN_LIGHT=0.90 SHADOW_LEVEL=0.45 ICE_FX ICE_SPARKLE=1.50
# EXTREME: alles auf Anschlag
profile.STUFE5=SHADOWS shadowMapResolution=4096 shadowDistance=128.0 SHADOW_SOFT=0.5 BLOOM BLOOM_STRENGTH=1.30 BLOOM_THRESHOLD=0.20 BLOOM_RADIUS=3.0 WAVING WAVE_STRENGTH=2.00 NEBULAS NEBULA_STRENGTH=1.60 CUSTOM_STARS STAR_AMOUNT=2.00 WATER_FX WATER_FOAM WATER_WAVES=2.50 WATER_REFLECT=1.00 WATER_DEPTH=2.00 EXPOSURE=1.10 CONTRAST=1.16 SATURATION=1.04 WARMTH=0.02 AIRY=0.00 VIGNETTE=0.28 HAZE=0.35 SUN_LIGHT=1.20 SHADOW_LEVEL=0.35 ICE_FX ICE_SPARKLE=2.00

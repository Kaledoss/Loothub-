# Baut Loothub+ bei jedem Push und stellt die fertige Mod bereit:
#  - als Release "Neueste Version" (Tab "Releases" im Repository) – direkt herunterladbar
#  - zusätzlich als Artefakt im jeweiligen Actions-Lauf
name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
      - name: Gradle-Wrapper prüfen
        uses: gradle/actions/wrapper-validation@v6
      - name: JDK einrichten
        uses: actions/setup-java@v5
        with:
          java-version: '25'  # Loom braucht Java 25 zum Bauen; die Mod selbst zielt weiter auf Java 21
          distribution: 'temurin'
      - name: Gradle-Wrapper ausführbar machen
        run: chmod +x ./gradlew
      - name: Bauen
        # Jede Version bekommt die Laufnummer als dritte Stelle (1.0.3, 1.0.4 …) –
        # daran erkennt die Update-Funktion im Spiel, dass es etwas Neues gibt.
        run: ./gradlew build --stacktrace -Pversion=1.0.${{ github.run_number }}
      - name: Mod-Datei bereitstellen (ohne -sources)
        run: |
          mkdir -p dist
          find build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;
          ls -l dist
      - name: Als Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: Loothub-Mod
          path: dist/
      - name: Release "Neueste Version" aktualisieren
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.jar \
            --title "Loothub+ 1.0.${{ github.run_number }}" \
            --notes "Automatisch gebaut aus Commit ${GITHUB_SHA::7}. Für Minecraft 1.21.11 (Fabric). Benötigt Fabric API 0.141.6+1.21.11." \
            --target "$GITHUB_SHA"

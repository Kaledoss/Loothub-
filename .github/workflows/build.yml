# Baut Loothub+ bei jedem Push und stellt die fertige Mod bereit:
#  - als Release "Neueste Version" (Tab "Releases" im Repository) – direkt herunterladbar
#  - zusätzlich als Artefakt im jeweiligen Actions-Lauf
name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # ganze Historie, damit die Änderungsliste seit dem letzten Release erstellt werden kann
      - name: Gradle-Wrapper prüfen
        uses: gradle/actions/wrapper-validation@v6
      - name: JDK einrichten
        uses: actions/setup-java@v5
        with:
          java-version: '25'  # Loom braucht Java 25 zum Bauen; die Mod selbst zielt weiter auf Java 21
          distribution: 'temurin'
      - name: Ludo-Kugelsymbole übernehmen (einmalig)
        if: hashFiles('tools/ludo_orbs.txt') != '' && github.ref == 'refs/heads/main'
        run: |
          pip install --quiet pillow
          python3 tools/fetch_ludo_orbs.py tools/ludo_orbs.txt src/main/resources/assets/loothub/textures/gui
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git rm -q tools/ludo_orbs.txt
          git add src/main/resources/assets/loothub/textures/gui/orb_*.png
          git commit -q -m "Eigene Kugelsymbole (Ludo) als Texturen gespeichert [skip ci]"
          git push origin HEAD:main
      - name: Gradle-Wrapper ausführbar machen
        run: chmod +x ./gradlew
      - name: Bauen
        # Jede Version bekommt die Laufnummer als dritte Stelle (1.0.3, 1.0.4 …) –
        # daran erkennt die Update-Funktion im Spiel, dass es etwas Neues gibt.
        run: ./gradlew build --stacktrace -Pversion=1.0.${{ github.run_number }}
      - name: Mod-Datei bereitstellen (ohne -sources)
        run: |
          mkdir -p dist
          find build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;
          ls -l dist
      - name: Als Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: Loothub-Mod
          path: dist/
      - name: Release "Neueste Version" aktualisieren
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Änderungen seit dem vorigen Release (Commit-Überschriften) – die Mod zeigt sie im Chat an
          OLD=$(gh api "repos/${{ github.repository }}/git/ref/tags/latest" -q .object.sha 2>/dev/null || true)
          if [ -n "$OLD" ] && git cat-file -e "$OLD" 2>/dev/null; then
            git log --no-merges --format='- %s' "$OLD..$GITHUB_SHA" > notes.md
          else
            git log --no-merges --format='- %s' -n 10 "$GITHUB_SHA" > notes.md
          fi
          [ -s notes.md ] || echo "- Kleinere Verbesserungen" > notes.md
          printf '\nFür Minecraft 1.21.11 (Fabric). Benötigt Fabric API 0.141.6+1.21.11.\n' >> notes.md
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.jar \
            --title "Loothub+ 1.0.${{ github.run_number }}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
